name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04

    env:
      PROJECT_PATH: ${{ secrets.PROJECT_PATH }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: bash build.sh

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key

          cat > ~/.ssh/config <<EOF
          Host production
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          EOF

      - name: Sync build
        run: rsync -az --delete dist/ production:$PROJECT_PATH/dist/

      - name: Sync package.json
        run: rsync -az package.json production:$PROJECT_PATH/package.json

      - name: Install production dependencies
        run: ssh production "cd $PROJECT_PATH && npm ci --omit=dev"

      - name: Restart application
        run: |
          ssh production "
            cd $PROJECT_PATH
            pm2 delete lavirant || true
            pm2 start ecosystem.config.cjs
            pm2 save
          "
